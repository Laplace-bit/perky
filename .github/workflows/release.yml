name: Local macOS installer release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      PERKY_BUILD_TRIPLE: arm64-apple-macosx14.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate tag and build optimized app
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            printf 'Expected a version tag beginning with v, got: %s\n' "$TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          PERKY_VERSION="$VERSION" PERKY_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" ./build-app.sh
          codesign --verify --deep --strict .build/Perky.app
          printf 'PERKY_RELEASE_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          printf 'PERKY_RELEASE_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
      - name: Build local admin installer
        run: ./package-local-installer.sh .build/Perky.app "$PERKY_RELEASE_VERSION" .build/packages
      - name: Publish GitHub release
        shell: bash
        run: |
          gh release create "$PERKY_RELEASE_TAG" .build/packages/*.pkg .build/packages/*.pkg.sha256 \
            --title "Perky $PERKY_RELEASE_VERSION" \
            --notes '本机自用 macOS 安装包，未使用 Apple Developer ID 或公证。首次打开时 Gatekeeper 可能要求你在系统设置的隐私与安全性页面手动允许。安装器会请求管理员认证，用于安装 root 权限的限时恢复 helper。'
