name: Signed macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      PERKY_BUILD_TRIPLE: arm64-apple-macosx14.0
      PERKY_CODESIGN_IDENTITY: ${{ secrets.PERKY_CODESIGN_IDENTITY }}
      CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate release credentials and import Developer ID certificate
        shell: bash
        run: |
          missing=()
          for name in PERKY_CODESIGN_IDENTITY CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD \
            NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$PERKY_CODESIGN_IDENTITY" != "Developer ID Application:"* ]]; then
            printf '%s\n' 'PERKY_CODESIGN_IDENTITY must be a Developer ID Application identity.' >&2
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/perky-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | \
            grep -F "$PERKY_CODESIGN_IDENTITY"
          {
            printf 'PERKY_KEYCHAIN_PATH=%s\n' "$KEYCHAIN_PATH"
            printf 'PERKY_CERTIFICATE_PATH=%s\n' "$CERTIFICATE_PATH"
            printf 'PERKY_KEYCHAIN_PASSWORD=%s\n' "$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build and sign app
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            printf 'Expected a version tag beginning with v, got: %s\n' "$TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          PERKY_VERSION="$VERSION" PERKY_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" ./build-app.sh
          APP=.build/Perky.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -F "TeamIdentifier="
          codesign -dv --verbose=4 "$APP/Contents/MacOS/PerkyLidHelper" 2>&1 | \
            grep -F "TeamIdentifier="
          printf 'PERKY_RELEASE_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          printf 'PERKY_RELEASE_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
      - name: Submit app for notarization and staple ticket
        shell: bash
        run: |
          NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 -D > "$NOTARY_KEY"
          ditto -c -k --sequesterRsrc --keepParent \
            .build/Perky.app "$RUNNER_TEMP/Perky-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Perky-notarization.zip" \
            --key "$NOTARY_KEY" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple .build/Perky.app
          xcrun stapler validate .build/Perky.app
      - name: Create and notarize DMG
        shell: bash
        run: |
          ./package-dmg.sh .build/Perky.app "$PERKY_RELEASE_VERSION" .build/packages
          DMG=".build/packages/Perky-$PERKY_RELEASE_VERSION-macos-arm64.dmg"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --deep --strict .build/Perky.app
          spctl --assess --type execute --verbose=4 .build/Perky.app
      - name: Publish GitHub release
        shell: bash
        run: |
          gh release create "$PERKY_RELEASE_TAG" .build/packages/* \
            --title "Perky $PERKY_RELEASE_VERSION" \
            --generate-notes
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${PERKY_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$PERKY_KEYCHAIN_PATH" || true
          fi
          if [[ -n "${PERKY_CERTIFICATE_PATH:-}" ]]; then
            rm -f "$PERKY_CERTIFICATE_PATH"
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/Perky-notarization.zip"
