name: macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      PERKY_BUILD_TRIPLE: arm64-apple-macosx14.0
    steps:
      - uses: actions/checkout@v4
      - name: Build app and run feature checks
        run: ./build-app.sh
      - name: Create local admin installer
        run: ./package-local-installer.sh .build/Perky.app "" .build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: perky-${{ github.sha }}-arm64
          path: .build/packages/*
          if-no-files-found: error
          retention-days: 14
